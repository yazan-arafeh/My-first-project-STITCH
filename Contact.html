<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet"  href="./src/output.css" >
</head>
<body class="bg-[#F5F3F3]"> 
    <header >
      <div class="container mx-auto flex justify-between items-center sm:px-4 py-6 md:px-16">
        <div class="mr-12">      
    <img src="./assets/imge/logo.svg" alt="Logo" class="w-24">
        </div>
  

        <nav>      
            <div class="sm:hidden md:block">
                <ul class="flex gap-8 text-sm font-semibold uppercase ">
                    <li><a href="index.html" class="hover:text-blue-600 border-b-2 border-transparent hover:border-blue-600">HOME</a></li>
                    <li><a href="Products.html" class="hover:text-blue-600 border-b-2 border-transparent hover:border-blue-600">PRODUCTS</a></li>
                    <li><a href="About Us.html" class="hover:text-blue-600 border-b-2 border-transparent hover:border-blue-600">ABOUT US</a></li>
                    <li><a href="Contact.html" class="hover:text-blue-600 border-b-2 border-transparent hover:border-blue-600">CONTACT</a></li>
                </ul>
             </div>
        </nav>

        <div>
  <ul class="flex gap-6">
    <li>
      <a href="#">
        <img src="./assets/imge/icon/search.svg" alt="Search" class="w-5 cursor-pointer" />
      </a>
    </li>

    <li>
      <a href="Cart.html">
        <img src="./assets/imge/icon/basket.svg" alt="Basket" class="w-5 cursor-pointer" />
      </a>
    </li>

    <li>
      <a href="Profile.html">
        <img src="./assets/imge/icon/Profile.svg" alt="Profile" class="w-5 cursor-pointer hidden md:block" />
      </a>
    </li>

    <li>
      <button>
        <img src="./assets/imge/icon/list.svg" alt="Menu" class="w-5 cursor-pointer sm:block md:hidden" />
      </button>
    </li>
  </ul>
</div>

       
      </div>


</header>


  

<div class="container mx-auto grid grid-cols-1 md:grid-cols-2 items-center sm:px-4 py-6 md:px-16 mt-31.5">
  
  <div >
    <p class="text-sm font-semibold text-blue-600 uppercase">Contact Us</p>
    <h2 class="text-[64px] font-bold text-black ">We're Here  To Help.</h2>
    <p class="text-gray-600 text-[18px]">
      Drop us a line and our team will get back to you <br> within 24 hours.
      Whether it's about an order or just a <br> question, we're ready.
    </p>
  </div>

  
  <form class="bg-white shadow-md rounded-md p-8 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold mb-1">NAME</label>
        <input type="text" placeholder="Your Full Name" class="w-full border-b border-gray-300 focus:border-black outline-none py-2 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">EMAIL</label>
        <input type="email" placeholder="email@address.com" class="w-full border-b border-gray-300 focus:border-black outline-none py-2 text-sm">
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold mb-1">SUBJECT</label>
      <select class="w-full border-b border-gray-300 focus:border-black outline-none py-2 text-sm">
        <option>Order Inquiry</option>
        <option>General Question</option>
        <option>Feedback</option>
      </select>
    </div>

    <div>
      <label class="block text-xs font-semibold mb-1">MESSAGE</label>
      <textarea placeholder="How can we assist you?" class="w-full border-b border-gray-300 focus:border-black outline-none py-2 text-sm h-24 mb-29.25"></textarea>
    </div>

    <button type="submit" class="bg-black text-white text-sm font-semibold px-6 py-2 rounded-sm hover:bg-gray-800 transition">
      SEND MESSAGE
    </button>
  </form>
</div>


<section class=" container mx-auto items-center sm:px-4 py-6 md:px-16 mt-31.5">
  
  <div class="rounded-md overflow-hidden shadow-md">
    <a href="#">
    <img src="./assets/imge/map.png" alt="Stitch Map" class="w-full h-full object-cover cursor-pointer">
    </a>
  </div>

 
</section>

</body>
</html>
