<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>product details</title>
  <link rel="stylesheet"  href="./src/output.css" >
</head>
<body>
  <header >
      <div class="container mx-auto flex justify-between items-center sm:px-4 py-6 md:px-16">
        <div class="mr-12">      
    <img src="./assets/imge/logo.svg" alt="Logo" class="w-24">
        </div>
  

        <nav>      
            <div class="sm:hidden md:block">
                <ul class="flex gap-8 text-sm font-semibold uppercase ">
                    <li><a href="index.html" class="hover:text-blue-600 border-b-2 border-transparent hover:border-blue-600">HOME</a></li>
                    <li><a href="Products.html" class="hover:text-blue-600 border-b-2 border-transparent hover:border-blue-600">PRODUCTS</a></li>
                    <li><a href="#" class="hover:text-blue-600 border-b-2 border-transparent hover:border-blue-600">ABOUT US</a></li>
                    <li><a href="#" class="hover:text-blue-600 border-b-2 border-transparent hover:border-blue-600">CONTACT</a></li>
                </ul>
             </div>
        </nav>

        <div>
          <ul class="flex gap-6">
               <li><img src="./assets/imge/icon/search.svg" alt="Search" class="w-4.20 cursor-pointer"></li>
               <li><img src="./assets/imge/icon/basket.svg" alt="Basket" class="w-4.20 cursor-pointer "></li>
               <li><img src="./assets/imge/icon/Profile.svg" alt="Profile" class="w-4.20 cursor-pointer hidden md:block"></li>
               <li> 
                   <button>
                    <img src="./assets/imge/icon/list.svg" alt="Search" class="w-4.20 cursor-pointer sm:block md:hidden"/>
                   </button>
               </li>
          </ul>
        
        </div>
       
      </div>


</header>


<div class="container mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 mt-12 sm:px-4 md:px-16">

    
    <div>
      <img src="./assets/imge/product-main.svg" alt="Sculpted Wool Sweater" class="w-full rounded-md shadow-sm hover:opacity-80 cursor-pointer"/>
      
      
      <div class="grid grid-cols-5 gap-3 mt-4">
        <img src="./assets/imge/product-detail-texture.svg" alt="Texture Detail" class="rounded-md cursor-pointer hover:opacity-80"/>
        <img src="./assets/imge/product-model-outdoor.svg" alt="Model Outdoor" class="rounded-md cursor-pointer hover:opacity-80"/>
        <img src="./assets/imge/product-back-view.svg" alt="Back View" class="rounded-md cursor-pointer hover:opacity-80"/>
        <img src="./assets/imge/product-model-indoor.svg" alt="Model Indoor" class="rounded-md cursor-pointer hover:opacity-80"/>
        <img src="./assets/imge/product-sleeve-detail.svg" alt="Sleeve Detail" class="rounded-md cursor-pointer hover:opacity-80"/>
      </div>
    </div>

    
    <div class="flex flex-col justify-center">
      <p class="text-sm tracking-widest text-black mb-2">NEW ARRIVAL / KNITWEAR</p>
      <h1 class="text-3xl font-bold mb-4">SCULPTED WOOL SWEATER</h1>
      <p class="text-black mb-6 leading-relaxed">
        A refined take on the classic mock-neck, crafted from<br> sustainable merino wool for a silhouette that balances<br> structure with ease.
      </p>

      
      <div class="flex items-center gap-4 mb-6">
        <span class="text-2xl font-semibold">$285.00</span>
        <span class="text-gray-400 line-through">$340.00</span>
      </div>

      
      <div class="mb-6">
        <p class="text-sm font-semibold mb-2">COLOR / CAMEL</p>
        <div class="flex gap-3">
          <div class="w-8 h-8 bg-black rounded-full cursor-pointer hover:border-gray-400 hover:border-solid hover:border-3"></div>
          <div class="w-8 h-8 bg-gray-400 rounded-full cursor-pointer hover:border-black hover:border-solid hover:border-3"></div>
          <div class="w-8 h-8 bg-yellow-800 rounded-full cursor-pointer hover:border-black hover:border-solid hover:border-3"></div>
        </div>
      </div>

      
      <div class="mb-6">
        <p class="text-sm font-semibold mb-2">SELECT SIZE <a href="#" class="text-gray-500 underline text-xs ml-2">Size Guide</a></p>
        <div class="flex gap-3">
          <button class="border border-gray-300 px-4 py-2 rounded-md">S</button>
          <button class="bg-black text-white px-4 py-2 rounded-md">M</button>
          <button class="border border-gray-300 px-4 py-2 rounded-md">L</button>
          <button class="border border-gray-300 px-4 py-2 rounded-md">XL</button>
        </div>
      </div>

      
      <div class="md:flex items-center gap-4 mb-6">
        <div class="flex items-center border border-gray-300 rounded-md sm:w-40">
          <button class="px-6 py-2 text-lg ">−</button>
          <span class="px-4 py-2">1</span>
          <button class="px-3 py-2 text-lg">+</button>
        </div>
        <button class="bg-black text-white px-8 py-3 rounded-md font-semibold hover:bg-blue-700 transition">ADD TO BAG</button>
      </div>

      
      <div class="flex items-center gap-2 text-black cursor-pointer hover:text-gray-500">
       <img src="./assets/imge/icon/heart.svg" alt="heart" class="hover:border-black hover:border-solid hover:border"/>
       <p class="pl-3">ADD TO WISHLIST</p>
      </div>
    </div>
  </div>
</body>
</html>
